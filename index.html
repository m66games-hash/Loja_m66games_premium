<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAEL66 Store</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --cor-primaria: #6a0dad;
            --cor-secundaria: #00d9ff;
            --cor-fundo: #0f0f1a;
            --cor-card: #1a1a2e;
            --cor-texto: #ffffff;
            --cor-destaque: #ffd700;
            --cor-erro: #ff4757;
            --cor-sucesso: #2ed573;
        }

        body {
            background: var(--cor-fundo);
            color: var(--cor-texto);
            min-height: 100vh;
        }

        /* Cabeçalho */
        header {
            background: linear-gradient(135deg, var(--cor-primaria), #4b0082);
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 15px rgba(106, 13, 173, 0.4);
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: bold;
            background: linear-gradient(90deg, var(--cor-secundaria), var(--cor-destaque));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-decoration: none;
        }

        .nav-botoes {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .btn {
            padding: 0.6rem 1.2rem;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primario {
            background: linear-gradient(90deg, var(--cor-secundaria), var(--cor-primaria));
            color: white;
        }

        .btn-primario:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 217, 255, 0.4);
        }

        .btn-carrinho {
            background: var(--cor-card);
            color: var(--cor-texto);
            border: 2px solid var(--cor-secundaria);
            position: relative;
        }

        .btn-carrinho span {
            position: absolute;
            top: -8px;
            right: -8px;
            background: var(--cor-erro);
            color: white;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        /* Seções */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .secao {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .secao.ativa {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h2 {
            font-size: 2rem;
            margin-bottom: 2rem;
            color: var(--cor-secundaria);
            border-bottom: 2px solid var(--cor-primaria);
            padding-bottom: 0.5rem;
        }

        /* Grade de Produtos */
        .grade-produtos {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .card-produto {
            background: var(--cor-card);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(106, 13, 173, 0.3);
            transition: all 0.3s ease;
        }

        .card-produto:hover {
            transform: translateY(-5px);
            border-color: var(--cor-secundaria);
            box-shadow: 0 10px 30px rgba(0, 217, 255, 0.15);
        }

        .produto-imagem {
            width: 100%;
            height: 180px;
            background: linear-gradient(135deg, var(--cor-primaria), var(--cor-secundaria));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
        }

        .produto-conteudo {
            padding: 1.2rem;
        }

        .produto-nome {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }

        .produto-desc {
            font-size: 0.9rem;
            color: #aaa;
            margin-bottom: 1rem;
            line-height: 1.4;
        }

        .produto-preco {
            font-size: 1.4rem;
            font-weight: bold;
            color: var(--cor-destaque);
            margin-bottom: 1rem;
        }

        .produto-categoria {
            display: inline-block;
            background: rgba(106, 13, 173, 0.3);
            color: var(--cor-secundaria);
            padding: 0.25rem 0.7rem;
            border-radius: 20px;
            font-size: 0.75rem;
            margin-bottom: 0.8rem;
        }

        /* Carrinho */
        .item-carrinho {
            background: var(--cor-card);
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .item-info h4 {
            font-size: 1rem;
        }

        .item-info p {
            font-size: 0.85rem;
            color: #aaa;
        }

        .item-controle {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .qtd-btn {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: none;
            background: var(--cor-primaria);
            color: white;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .remover-btn {
            background: var(--cor-erro);
            color: white;
            border: none;
            padding: 0.4rem 0.8rem;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .carrinho-total {
            margin-top: 2rem;
            text-align: right;
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--cor-destaque);
        }

        .carrinho-vazio {
            text-align: center;
            padding: 3rem;
            color: #666;
            font-size: 1.1rem;
        }

        /* Formulários */
        .formulario {
            max-width: 500px;
            margin: 0 auto;
            background: var(--cor-card);
            padding: 2rem;
            border-radius: 12px;
            border: 1px solid rgba(106, 13, 173, 0.3);
        }

        .grupo-form {
            margin-bottom: 1.2rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        input, select, textarea {
            width: 100%;
            padding: 0.8rem;
            border-radius: 6px;
            border: 1px solid #444;
            background: #111;
            color: white;
            font-size: 1rem;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--cor-secundaria);
        }

        .aviso {
            padding: 1rem;
            border-radius: 6px;
            margin: 1rem 0;
            text-align: center;
            display: none;
        }

        .aviso.sucesso {
            background: rgba(46, 213, 115, 0.15);
            color: var(--cor-sucesso);
            border: 1px solid var(--cor-sucesso);
        }

        .aviso.erro {
            background: rgba(255, 71, 87, 0.15);
            color: var(--cor-erro);
            border: 1px solid var(--cor-erro);
        }

        /* Responsivo */
        @media (max-width: 600px) {
            .nav-container {
                flex-direction: column;
                gap: 0.8rem;
            }
            .container {
                padding: 1rem;
            }
            .grade-produtos {
                grid-template-columns: 1fr;
            }
        }

        /* Modal */
        .modal-fundo {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 200;
        }

        .modal {
            background: var(--cor-card);
            padding: 2rem;
            border-radius: 12px;
            max-width: 450px;
            width: 90%;
            border: 2px solid var(--cor-primaria);
        }

        .modal h3 {
            margin-bottom: 1rem;
            color: var(--cor-secundaria);
        }

        .modal-botoes {
            display: flex;
            gap: 0.8rem;
            justify-content: flex-end;
            margin-top: 1.5rem;
        }

        .btn-fechar {
            background: #444;
            color: white;
        }
    </style>
</head>
<body>

    <!-- Cabeçalho -->
    <header>
        <div class="nav-container">
            <a href="#" class="logo" onclick="mostrarSecao('loja')">MAEL66 Store</a>
            <div class="nav-botoes">
                <button class="btn" onclick="mostrarSecao('loja')">Produtos</button>
                <button class="btn btn-carrinho" onclick="mostrarSecao('carrinho')">
                    🛒 Carrinho <span id="contador-carrinho">0</span>
                </button>
                <button class="btn" onclick="mostrarSecao('conta')" id="btn-conta">👤 Entrar</button>
            </div>
        </div>
    </header>

    <main class="container">
        <!-- Seção Loja -->
        <section id="secao-loja" class="secao ativa">
            <h2>🎮 Produtos Disponíveis</h2>
            <div class="grade-produtos" id="lista-produtos"></div>
        </section>

        <!-- Seção Carrinho -->
        <section id="secao-carrinho" class="secao">
            <h2>🛒 Seu Carrinho</h2>
            <div id="lista-carrinho"></div>
            <div class="carrinho-total" id="total-carrinho"></div>
            <div style="text-align: right; margin-top: 1.5rem;">
                <button class="btn btn-primario" onclick="finalizarCompra()">✅ Finalizar Compra</button>
                <button class="btn" style="background: #444; color: white;" onclick="limparCarrinho()">🗑️ Limpar</button>
            </div>
        </section>

        <!-- Seção Conta / Login -->
        <section id="secao-conta" class="secao">
            <div id="area-login">
                <h2 style="text-align: center;">🔐 Minha Conta</h2>
                <div class="formulario">
                    <div id="aviso-form" class="aviso"></div>
                    
                    <div id="form-entrar">
                        <h3 style="margin-bottom: 1rem;">Entrar</h3>
                        <div class="grupo-form">
                            <label>E-mail</label>
                            <input type="email" id="login-email" placeholder="seu@email.com">
                        </div>
                        <div class="grupo-form">
                            <label>Senha</label>
                            <input type="password" id="login-senha" placeholder="Sua senha">
                        </div>
                        <button class="btn btn-primario" style="width: 100%; margin-top: 0.5rem;" onclick="fazerLogin()">Entrar</button>
                        <p style="text-align: center; margin-top: 1rem; font-size: 0.9rem;">
                            Não tem conta? <a href="#" onclick="trocarFormulario('cadastro')" style="color: var(--cor-secundaria);">Cadastre-se</a>
                        </p>
                    </div>

                    <div id="form-cadastro" style="display: none;">
                        <h3 style="margin-bottom: 1rem;">Criar Conta</h3>
                        <div class="grupo-form">
                            <label>Nome Completo</label>
                            <input type="text" id="cad-nome" placeholder="Seu nome">
                        </div>
                        <div class="grupo-form">
                            <label>E-mail</label>
                            <input type="email" id="cad-email" placeholder="seu@email.com">
                        </div>
                        <div class="grupo-form">
                            <label>Senha</label>
                            <input type="password" id="cad-senha" placeholder="Mínimo 6 caracteres">
                        </div>
                        <button class="btn btn-primario" style="width: 100%; margin-top: 0.5rem;" onclick="fazerCadastro()">Criar Conta</button>
                        <p style="text-align: center; margin-top: 1rem; font-size: 0.9rem;">
                            Já tem conta? <a href="#" onclick="trocarFormulario('login')" style="color: var(--cor-secundaria);">Entrar</a>
                        </p>
                    </div>
                </div>
            </div>

            <div id="area-usuario" style="display: none;">
                <h2 style="text-align: center;">👤 Bem-vindo, <span id="usuario-nome"></span>!</h2>
                <div class="formulario">
                    <p><strong>E-mail:</strong> <span id="usuario-email"></span></p>
                    <hr style="margin: 1rem 0; border-color: #333;">
                    <h4 style="margin-bottom: 0.5rem;">📦 Seus Pedidos</h4>
                    <div id="lista-pedidos" style="max-height: 300px; overflow-y: auto;"></div>
                    <button class="btn" style="background: var(--cor-erro); color: white; width: 100%; margin-top: 1rem;" onclick="fazerLogout()">Sair da Conta</button>
                </div>
            </div>
        </section>

        <!-- Seção Finalizar Compra -->
        <section id="secao-finalizar" class="secao">
            <h2>💳 Finalizar Compra</h2>
            <div class="formulario">
                <h3 style="margin-bottom: 1rem;">Dados de Entrega</h3>
                <div class="grupo-form">
